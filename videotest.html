<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video embed</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .video-wrapper {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    video {
      width: 100%;
      max-width: 800px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <h1>Mijn video</h1>
    <video controls>
      <source src="https://elektrafungi.com/kw1c/video.mp4" type="video/mp4" />
      Je browser ondersteunt deze video niet.
    </video>
  </div>
</body>
</html>
