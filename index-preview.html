<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene Preview</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: sans-serif;
    }

    /* TOEGEVOEGD:
       vaste fullscreen container voor Three.js canvas */
    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #111;
    }

    #status {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 12px;
      border-radius: 8px;
    }

    #errorBox {
      position: fixed;
      top: 60px;
      left: 16px;
      z-index: 10;
      color: white;
      background: rgba(160, 0, 0, 0.8);
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
      max-width: 420px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="status">Laden...</div>
  <div id="errorBox"></div>

  <!-- AANGEPAST:
       pad gewijzigd van ./public/assets/video.mp4 naar /assets/video.mp4
       omdat bestanden in public meestal vanaf root geserveerd worden -->
  <video
    id="promoVideo"
    src="https://elektrafungi.com/kw1c/video.mp4"
    playsinline
    webkit-playsinline
    loop
    crossorigin="anonymous"
    style="display: none"
  ></video>

  <script type="module" src="./main-preview.js"></script>
</body>
</html>
