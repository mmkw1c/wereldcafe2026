<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebAR Template</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      text-align: center;
      padding: 20px;
      background: rgba(0,0,0,0.5);
    }

    #startBtn {
      padding: 16px 20px;
      font-size: 18px;
      border-radius: 12px;
      border: none;
      background: white;
      cursor: pointer;
    }

    #status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      z-index: 30;
    }

    #errorBox {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 40;
      background: #ff3b30;
      color: white;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }

    .hidden {
      display: none !important;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="app"></div>

  <div id="ui">
    <button id="startBtn">Start AR</button>
    <div>Scan de afbeelding om AR te starten</div>
  </div>

  <div id="status">Wachten op start...</div>

  <div id="errorBox"></div>

  <video
    id="promoVideo"
    src="https://elektrafungi.com/kw1c/video.mp4"
    playsinline
    muted
    loop
    preload="auto"
    style="display:none"
  ></video>

  <script type="module" src="./main.js"></script>

</body>
</html>
